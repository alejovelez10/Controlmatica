# OJO: Customer NO declara `belongs_to :user` (app/models/customer.rb solo tiene
# has_many y scopes). Por eso `user: admin` NO sirve: Rails intentaria escribir
# una columna `user` inexistente y `fixtures :all` tumbaria la suite entera.
# Se usa user_id con FixtureSet.identify, igual que en parameterizations.yml.

