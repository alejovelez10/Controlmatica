# Los 8 usuarios canonicos. Todos comparten la misma contrasena
# (AuthenticationHelpers::FIXTURE_PASSWORD = "password123") y el hash se calcula
# UNA sola vez aqui arriba en vez de seis veces. En test devise usa
# config.stretches = 1, asi que el costo es despreciable.
#
# NO se pone `avatar`: montar el uploader en fixtures no aporta nada y arrastra
# CarrierWave a la carga de `fixtures :all`.
<% digest = Devise::Encryptor.digest(User, "password123") %>

