# Los 8 usuarios canonicos. Todos comparten la misma contrasena
# (AuthenticationHelpers::FIXTURE_PASSWORD = "password123") y el hash se calcula
# UNA sola vez aqui arriba en vez de seis veces. En test devise usa
# config.stretches = 1, asi que el costo es despreciable.
#
# NO se pone `avatar`: montar el uploader en fixtures no aporta nada y arrastra
# CarrierWave a la carga de `fixtures :all`.
<% digest = Devise::Encryptor.digest(User, "password123") %>

# TELEFONOS (paquete 11): las fixtures se insertan por SQL directo y NO ejecutan
# el callback `set_phone_normalized`, asi que `phone_normalized` va explicito y
# tiene que ser coherente con `User.normalize_phone(phone)` (ultimos 10 digitos).
# Si alguien cambia uno sin el otro, los tests de actor por telefono resuelven a
# nadie y el fallo no dice por que.
admin:
  email: admin@controlmatica.test
  encrypted_password: <%= digest %>
  names: Ana
  last_names: Ruiz
  rol: administrador
  document_type: CC
  number_document: 100000001
  menu: nav-sm
  sign_in_count: 0
  phone: "+57 310 555 0000"
  phone_normalized: "3105550000"

