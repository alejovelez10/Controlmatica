# Los 6 modulos reales. El sistema los busca por STRING LITERAL
# (has_menu_permission?("Gastos", "Crear")), asi que los nombres de relleno del
# scaffold eran inservibles.
#
# "Reportes de servicios" y "Tablero de Ingenieros" son OBLIGATORIOS:
# ApplicationController#after_sign_in_path_for hace .id sobre
# ModuleControl.find_by_name sin guarda de nil. Sin ellos, cualquier prueba que
# haga login por el formulario revienta con NoMethodError.

