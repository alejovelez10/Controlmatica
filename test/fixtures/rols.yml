# Roles canonicos del proyecto. Los demas paquetes AGREGAN etiquetas aqui,
# nunca renombran ni reescriben las existentes (00-ARQUITECTURA.md 7.2).
#
# El HABTM con accion_modules se declara INLINE (lista separada por comas con
# las etiquetas de accion_modules.yml). NO existe test/fixtures/accion_modules_rols.yml
# y no se debe crear: una fixture de tabla suelta no resuelve etiquetas y obliga
# a escribir ActiveRecord::FixtureSet.identify a mano en cada fila.

administrador:
  name: Administrador   # literal y case-sensitive: is_admin? compara este string
  description: Acceso total por rol; las acciones de Presupuesto de gastos SI son explicitas
  # Presupuesto de gastos es el unico modulo donde `is_admin?` NO es un bypass
  # (ver ExpenseBudgetsController#budget_permission?): sin estas 5 etiquetas el
  # admin recibiria 403 en todos los endpoints de partidas. En los demas modulos
  # sigue pasando por rol, y por eso este fixture no lista nada mas.
  accion_modules: presupuesto_ingreso, presupuesto_crear, presupuesto_editar,
                  presupuesto_eliminar, presupuesto_ver_todos

gerente:
  name: Gerente
  description: Tiene TODOS los permisos por accion_modules (no es admin)
  accion_modules: gastos_ingreso, gastos_crear, gastos_editar, gastos_eliminar,
                  gastos_aceptar, gastos_exportar, gastos_ver_todos, gastos_responsable,
                  presupuesto_ingreso, presupuesto_crear, presupuesto_editar,
                  presupuesto_eliminar, presupuesto_ver_todos,
                  contabilidad_ingreso, contabilidad_aprobar, contabilidad_exportar,
                  contabilidad_ver_todos, centro_ingreso, centro_editar,
                  reportes_ingreso, tablero_ver

ingeniero:
  name: Ingeniero
  description: Solo crea y edita sus propios gastos
  accion_modules: gastos_ingreso, gastos_crear, gastos_editar, reportes_ingreso

contador:
  name: Contador
  description: Solo contabilidad
  # `contabilidad_exportar` lo AGREGA el paquete 09 (no reescribe la etiqueta):
  # sus tests de vista afirman que `@estados` llega con las tres claves en true
  # para este rol, que es el usuario canonico de la pantalla de Contabilidad.
  # Los tests del 06 que prueban el gate de exportacion lo revocan a mano con
  # `revoke_permission!`, asi que no dependen de este default.
  accion_modules: contabilidad_ingreso, contabilidad_aprobar, contabilidad_exportar,
                  contabilidad_ver_todos, reportes_ingreso

sin_permisos:
  name: Sin permisos
  description: Rol vacio, para probar los gates de 403

# --- Roles del paquete 07 (API de presupuesto) ------------------------------
# Los agrega el 07 sobre el set del 01; no renombra ni reescribe nada anterior.
#
# La diferencia entre los dos es UNA sola accion, "Ver todos", y es la que
# separa "administro las partidas de todo el centro" de "solo veo las mias".
# Sin dos roles distintos no hay forma de probar que el filtro por
# `user_id: current_user.id` de get_expense_budgets existe: con un rol que lo
# tiene todo, el test pasaria igual aunque el filtro no estuviera.

presupuesto_pleno:
  name: Presupuesto pleno
  description: Todas las acciones de Presupuesto, incluida Ver todos
  accion_modules: presupuesto_ingreso, presupuesto_crear, presupuesto_editar,
                  presupuesto_eliminar, presupuesto_ver_todos

presupuesto_limitado:
  name: Presupuesto limitado
  description: Acciones de Presupuesto SIN Ver todos (solo administra lo propio o lo de su centro)
  accion_modules: presupuesto_ingreso, presupuesto_crear, presupuesto_editar,
                  presupuesto_eliminar
